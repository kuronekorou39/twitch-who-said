<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Who Said</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <img src="/icon48.png" alt="" width="28" height="28" />
      <div>
        <div class="title">Who Said</div>
        <div class="sub">Twitch チャット履歴</div>
      </div>
    </header>

    <div class="stats">
      <div><span id="st-messages" class="num">–</span><span class="label">メッセージ</span></div>
      <div><span id="st-users" class="num">–</span><span class="label">ユーザー</span></div>
      <div><span id="st-channels" class="num">–</span><span class="label">チャンネル</span></div>
    </div>
    <div id="last-ingest" class="muted small"></div>

    <nav>
      <button id="open-channel" class="link-card primary" type="button" hidden>
        <span class="link-title">#<span id="channel-name"></span> の履歴</span>
        <span class="link-desc"><span id="channel-count"></span> 件 · いま開いているチャンネル</span>
      </button>
      <button id="open-viewer" class="link-card" type="button">
        <span class="link-title">履歴ビューア</span>
        <span class="link-desc">すべてのメッセージをユーザー・チャンネル・キーワードで探す</span>
      </button>
      <button id="open-options" class="link-card" type="button">
        <span class="link-title">設定</span>
        <span class="link-desc">保持ポリシー・除外・エクスポート / インポート</span>
      </button>
    </nav>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
